# Publishes the PWA to Firebase Hosting on every push to main.
# Needs repository secrets: FIREBASE_SERVICE_ACCOUNT (JSON key of a service account with the
# "Firebase Hosting Admin" role), VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY.
name: Deploy PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Check required secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for v in FIREBASE_SERVICE_ACCOUNT VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see docs/deploy.md)"; exit 1; fi
          # an empty URL would still build, but the app would crash on start
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) echo "::error::VITE_SUPABASE_URL must be the full https://<ref>.supabase.co address"; exit 1;; esac
      - run: npm ci
      - run: npm test
      - run: npm run web:build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: latelotto
          channelId: live
